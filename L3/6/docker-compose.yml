version: "3.8"

services:
  db:
    image: postgres:17
    container_name: l3_6_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_l3_6:/var/lib/postgresql/data
    ports:
      - "5433:5432" # Changed from 5432:5432 to 5433:5432 to avoid conflict
    networks:
      - l3_6_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: l3_6_app
    restart: always
    environment:
      POSTGRES_HOST: db # Connect to the db service by its name within the Docker network
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_PORT: ${APP_PORT}
    ports:
      - "${APP_PORT}:${APP_PORT}" # Map host port to container port
    depends_on:
      - db
    networks:
      - l3_6_network

networks:
  l3_6_network:
    driver: bridge

volumes:
  postgres_data_l3_6:
