<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CommentTree</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>CommentTree</h1>

        <div class="search-section">
            <input type="text" id="search-input" placeholder="Search comments...">
            <button id="search-button">Search</button>
        </div>

        <div class="comments-section" id="comments-section">
            <!-- Comments will be loaded here -->
        </div>

        <div class="new-comment-section">
            <h2>Add a New Comment</h2>
            <textarea id="new-comment-content" placeholder="Your comment..."></textarea>
            <input type="text" id="new-comment-parent-id" placeholder="Parent Comment ID (optional)">
            <button id="submit-comment">Submit Comment</button>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
